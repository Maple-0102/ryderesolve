<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>RydeResolve — Demo presentation</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:'Segoe UI',Arial,sans-serif;background:#071d29;color:#f4faf9}#slide{height:100vh;padding:130px 140px 160px;position:relative;background:radial-gradient(ellipse at 90% 0%,#18444d 0,transparent 55%)}.eyebrow{font-size:19px;letter-spacing:5px;color:#6ce2ce;font-weight:700;margin-bottom:26px}h1{font-size:76px;line-height:1.09;letter-spacing:-2px;margin:0 0 30px;max-width:1350px}h1 em{font-style:normal;color:#6ce2ce}.sub{font-size:28px;line-height:1.5;color:#b8ced2;max-width:1350px;margin:0 0 38px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:34px}.grid.two{grid-template-columns:repeat(2,1fr)}.card{border:1px solid #34515b;background:#122e3a;border-radius:22px;padding:32px;min-height:220px;position:relative;transition:transform .5s,border-color .5s}.card h2{font-size:28px;margin:0 0 18px;font-weight:600}.card p{font-size:23px;line-height:1.45;color:#bad0d5;margin:10px 0}.number{font-size:72px;line-height:1.1;color:#6ce2ce;font-weight:650;letter-spacing:-2px;margin:18px 0}.small{font-size:19px!important;color:#9ab5be!important}.tag{display:inline-block;color:#86eddb;background:#1a454c;border:1px solid #37717a;padding:8px 15px;border-radius:6px;font-size:18px;margin-bottom:16px}.arrow{font-size:50px;color:#4ac9b4;position:absolute;right:-28px;top:100px;z-index:2}.workflow{display:flex;gap:18px;margin:50px 0}.node{flex:1;background:#143440;border:1px solid #41616b;border-radius:18px;padding:26px 20px;min-height:220px;font-size:25px;font-weight:600}.node b{display:block;color:#70dfcd;font-size:17px;letter-spacing:3px;margin-bottom:25px}.node span{display:block;font-size:19px;font-weight:400;color:#b9d0d6;margin-top:16px;line-height:1.4}.foot{font-size:21px;color:#9ab6c0;margin-top:30px}.line{height:5px;background:#65d9c4;width:90px;margin-bottom:32px}.pill{padding:14px 23px;border:1px solid #3e646e;border-radius:100px;font-size:22px;display:inline-block;margin:16px 12px 0 0;color:#a6eadf}.quote{font-size:45px;line-height:1.35;max-width:1350px;margin-top:45px}.accent{color:#75e6d2}.glow{border-color:#6ce2ce!important;transform:translateY(-7px);box-shadow:0 10px 35px #0003}.logo{font-size:112px;letter-spacing:-5px;line-height:1.1;font-weight:650;color:#fff;margin-bottom:26px}.logo span{color:#6ce2ce}
</style></head><body><div id="slide"></div>
<script>
const content={
hook:`<div class="eyebrow">A RIDE. A CHARGE. A QUESTION.</div><h1>A small charge.<br>A bigger <em>trust problem.</em></h1><div class="grid"><div class="card" id="quote"><h2>Quoted</h2><div class="number">S$12.00</div><p>The rider's expectation</p></div><div class="card" id="charged"><h2>Charged</h2><div class="number">S$16.50</div><p>The completed ride</p></div><div class="card" id="difference"><h2>Disputed difference</h2><div class="number">S$4.50</div><p>What changed — and who pays?</p></div></div><p class="foot">Official organizer sample · DISP-003 · Illustrative case, not a real customer claim</p>`,
value:`<div class="eyebrow">PROJECT OVERVIEW</div><div class="logo">Ryde<span>Resolve</span></div><h1 style="font-size:62px">An explanation both sides can inspect.</h1><div class="grid"><div class="card" id="rider"><div class="tag">RIDER</div><h2>Understand the charge</h2><p>A reason and the evidence behind it.</p></div><div class="card" id="driver"><div class="tag">DRIVER</div><h2>Have a visible voice</h2><p>A distinct advocate for the driver's position.</p></div><div class="card" id="support"><div class="tag">SUPPORT TEAM</div><h2>Review a structured case</h2><p>Traceable sources and explicit human handoffs.</p></div></div>`,
workflow:`<div class="eyebrow">THE AGENT WORKFLOW</div><h1>One shared record.<br><em>Two perspectives.</em></h1><div class="workflow"><div class="node" id="select"><b>01</b>Select case<span>Three official dispute samples</span></div><div class="node" id="evidence"><b>02</b>Prepare evidence<span>Versioned facts + policy sources</span></div><div class="node" id="advocates"><b>03</b>Two advocates<span>Opening → one response</span></div><div class="node" id="judge"><b>04</b>Judge + checks<span>Original records + both positions</span></div><div class="node" id="outcome"><b>05</b>Review outcome<span>Explain the suggestion or refer to a human</span></div></div><p class="foot">Bounded workflow · No endless debate · No payment execution</p>`,
recovery:`<div class="eyebrow">ENGINEERING FOR REAL WORKFLOWS</div><h1>Incomplete information.<br><em>Recoverable execution.</em></h1><div class="grid"><div class="card" id="checkpoints"><div class="tag">PRESERVE</div><h2>Stage checkpoints</h2><p>Reuse completed outputs when a compatible CLI run resumes.</p></div><div class="card" id="limits"><div class="tag">BOUND</div><h2>Execution budgets</h2><p>Limits for provider calls, active time and recorded tokens.</p></div><div class="card" id="failure"><div class="tag">DISTINGUISH</div><h2>Failure ≠ referral</h2><p>A transport error and a policy gate need different next actions.</p></div></div><p class="foot">Resume requires matching source, implementation, provider configuration and limits.</p>`,
evaluation:`<div class="eyebrow">WHAT THE DEMONSTRATION ESTABLISHES</div><h1>A successful run.<br><em>An honest next step.</em></h1><div class="grid two"><div class="card" id="success"><div class="tag">SAVED LIVE FARE RUN</div><div class="number">6 calls</div><p>4 Advocate turns + Judge + optional reviewer</p><p class="small">Saved 16 Oct 2026 · Implementation checks passed</p></div><div class="card" id="limits"><div class="tag">DEVELOPMENT FINDINGS</div><h2>Keep the failures visible</h2><p>Statement versus incident-fact support remains a challenge.</p><p class="small">Small, related examples do not establish general accuracy, fairness or resolution speed.</p></div></div>`,
build:`<div class="eyebrow">OUR BUILD APPROACH</div><h1>Three components.<br><em>One shared contract.</em></h1><div class="grid"><div class="card" id="data"><div class="tag">EVIDENCE / DATA / TOOLS</div><h2>Traceable facts</h2><p>Original records, deterministic calculations and source lookup.</p></div><div class="card" id="agents"><div class="tag">ADVOCATES</div><h2>Two perspectives</h2><p>Evidence-linked claims, openings and bounded responses.</p></div><div class="card" id="orchestration"><div class="tag">JUDGE / ORCHESTRATION / UI</div><h2>A reviewable outcome</h2><p>Policy checks, execution recovery and human handoff.</p></div></div><p class="foot">Stable case IDs · Stable evidence references · One versioned snapshot per run</p>`,
tips:`<div class="eyebrow">PRACTICAL DEVELOPMENT TOOL TIPS</div><h1>Make every change<br><em>easy to verify.</em></h1><div class="grid"><div class="card" id="contracts"><div class="tag">INTERFACES</div><h2>JSON schemas</h2><p>Check the shape of each agent output before passing it downstream.</p></div><div class="card" id="sources"><div class="tag">PROVENANCE</div><h2>Originals + hashes</h2><p>Preserve sources and bind arguments to their exact snapshot.</p></div><div class="card" id="review"><div class="tag">COLLABORATION</div><h2>Pull requests + regressions</h2><p>Retain failed cases. Separate offline checks from live model evaluation.</p></div></div><p class="foot">Evaluation answers stay outside agent inputs.</p>`,
close:`<div class="eyebrow">RYDERESOLVE · HACKATHON PROTOTYPE</div><div class="logo">Ryde<span>Resolve</span></div><h1>Every dispute deserves<br><em>an explanation.</em></h1><p class="sub">Every recommendation should show its evidence.</p><div><span class="pill">A clearer reason for riders</span><span class="pill">A visible voice for drivers</span><span class="pill">A structured case for support</span></div><p class="foot" style="margin-top:48px">Next: broader independent evaluation + authenticated operational integration</p>`
};
const id=new URLSearchParams(location.search).get('slide')||'hook';document.querySelector('#slide').innerHTML=content[id]||content.hook;
</script></body></html>
