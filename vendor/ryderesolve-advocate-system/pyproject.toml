[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ryderesolve-advocate"
version = "0.1.0"
description = "Evidence-grounded rider and driver advocates for RydeResolve"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18,<5"]

[project.scripts]
ryde-advocate = "ryderesolve_advocate.cli:main"

[tool.setuptools.packages.find]
include = ["ryderesolve_advocate*"]

[tool.setuptools.package-data]
ryderesolve_advocate = ["prompts/*.txt", "contracts/*.json"]
